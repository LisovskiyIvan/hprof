name: TS CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          cache: true
          cache-key: 'v1-rust-ci'

      - name: Build native (release)
        run: cargo build --release -p hprof-c

      - name: oxlint
        run: bun run lint

      - name: oxfmt check
        run: bun run fmt:check

  test:
    name: Test (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          cache: true
          cache-key: 'v1-rust-ci'

      - name: Build native (release)
        run: cargo build --release -p hprof-c

      - name: Run core tests
        run: bun test packages/core/tests

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install (root)
        run: bun install --frozen-lockfile

      - name: Install (client)
        run: bun install --frozen-lockfile
        working-directory: packages/ui/src/client

      - name: Build UI bundle
        run: bun run build
        working-directory: packages/ui/src/client

      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: packages/ui/src/client/dist/
